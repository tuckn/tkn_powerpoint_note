schema_version: "3.0.0"

# No source catalog or pull/push synchronization.
selection:
  slides: null
  sections: []
  include_hidden: false
  off_slide: exclude # exclude or append; fully outside shapes only

extraction:
  include_notes: true
  include_comments: true
  max_file_mb: 100
  max_uncompressed_mb: 1024

# Generative AI connections live in this file. No GenAI Bridge config file is read.
# CLI providers reuse their existing login; tokens and passwords do not belong here.
genai_profiles:
  codex-default:
    provider: codex
    model: null # null: use the provider CLI's default model.
  claude-default:
    provider: claude-code
    model: null
  copilot-default:
    provider: github-copilot
    model: null
  antigravity-default:
    provider: antigravity
    model: null

generation:
  # CLI --generator > this default; null uses the shared generation settings.
  default_generator: my-codex-def
  generators:
    my-codex-def:
      genai_profile: codex-default # selects a connection from genai_profiles above
      prompt_profile: default-ja # templates own the language and structure
      overrides: {} # model, reasoning_effort, timeout_seconds, max_output_tokens, local_only
    my-codex-en:
      genai_profile: codex-default
      prompt_profile: default-en

  # --genai-profile / --prompt-profile override the selected generator for one invocation.
  # Ordinary extraction uses the prompt profile without calling AI; AI requires --context.
  profile_dirs: [] # ordered parent directories containing complete profile bundles
  max_slides: 10 # safety limit per context export; never silently truncate
  max_input_chars: 120000
  image_width: 2400
  render_timeout_seconds: 180
