schema_version: "4.0.0"

# Synchronization targets for pull and status (--source ID). export does not use them.
sources:
  personal-powerpoint:
    presentations:
      dir: 'C:\path\to\powerpoint-presentations'
      recursive: false
      include:
        - "*.pptx"
        - "*.pptm"
      ignore: []
    notes:
      dir: 'C:\path\to\obsidian-vault\reference\entities\files\PowerPoint'
      frontmatter_term_format: obsidian-link # obsidian-link ([[...]]) or plain
    # Optional source-specific generation settings:
    # generation:
    #   generator: my-codex-def

extraction:
  include_hidden: false
  off_slide: exclude # exclude or append; fully outside shapes only
  include_notes: true
  include_comments: true
  max_file_mb: 100
  max_uncompressed_mb: 1024

# Optional `export --context` and `pull --context` use GenAI Bridge.
# Connections/models/authentication are owned by this application in genai_profiles.
# GenAI Bridge shared configuration is never loaded.
# CLI providers reuse their existing login; tokens and passwords do not belong here.
genai_profiles:
  codex-default:
    provider: codex
    model: null # null: use the provider CLI's default model.
  claude-default:
    provider: claude-code
    model: null
  copilot-default:
    provider: github-copilot
    model: null
  antigravity-default:
    provider: antigravity
    model: null

generation:
  # Reusable generation settings. CLI --generator > source generation.generator > this default.
  default_generator: my-codex-def
  generators:
    my-codex-def:
      genai_profile: codex-default # selects a connection from genai_profiles above
      # Templates define the language and structure; use default-en for English.
      prompt_profile: default-ja
      overrides: {} # model, reasoning_effort, timeout_seconds, max_output_tokens, local_only
    my-codex-en:
      genai_profile: codex-default
      prompt_profile: default-en

  # Ordered parent directories for custom prompt profiles (resolved from the working directory).
  prompt_profile_dirs: []
  limits:
    max_slides: 10 # Slides sent to AI per presentation in one run; reused slides do not count.
    max_input_chars: 120000 # Evidence JSON per slide; a slide over the limit is skipped.
    image_width: 2400 # Pixels (600-8000). Changing it regenerates explanations.
    max_render_seconds: 600 # PowerPoint rendering of one presentation.
