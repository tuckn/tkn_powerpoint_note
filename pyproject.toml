[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tkn-powerpoint-note"
version = "0.3.0"
description = "Create source-backed PowerPoint Markdown notes with optional visual context."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Tuckn" }]
dependencies = ["PyYAML>=6.0.2", "defusedxml>=0.7.1", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
context = [
  "tkn-genai-bridge @ https://github.com/tuckn/tkn_genai_bridge/archive/9cf534e47159901c3bb05bb802695fad746cc338.zip",
  "pywin32>=308; sys_platform == 'win32'",
]

[project.scripts]
tkn-powerpoint-note = "powerpoint_note.cli:main"

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12", "mypy>=1.17", "types-PyYAML", "types-defusedxml", "types-jsonschema"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/powerpoint_note"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
